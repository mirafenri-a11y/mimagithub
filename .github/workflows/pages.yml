name: Deploy to GitHub Pages

# 対象ブランチへの push で自動公開。
# それ以外のブランチを試したいときは Actions タブから手動実行（Run workflow）で
# 任意のブランチを公開できる。
on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # enablement: true → リポジトリの Pages がまだ有効でなければ自動で有効化する
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 公開用ファイルをまとめる
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r assets _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
