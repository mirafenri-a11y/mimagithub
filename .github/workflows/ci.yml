name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: ロジックのテスト（診断・バドミントン）
        run: npm test

      - name: 参照ファイルの存在チェック
        run: |
          set -e
          for f in index.html assets/style.css assets/data.js assets/logic.js assets/app.js \
                   badminton/index.html badminton/style.css badminton/lessons.js badminton/progress.js badminton/app.js; do
            test -f "$f" || { echo "missing: $f"; exit 1; }
          done
          echo "OK: すべての参照ファイルが存在します"
